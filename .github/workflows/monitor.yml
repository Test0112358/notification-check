name: ACCC Register Monitor + Verify

on:
  schedule:
    - cron: '0 0,6  * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (optional)'
        required: false
        default: 'Manual run'

jobs:
  scrape:
    name: Scrape ACCC Acquisitions Register
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        run: python scraper.py

      - name: Commit data files
        if: steps.scraper.outputs.has_changes == 'true'
        run: |
          git config user.name "ACCC Monitor Bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Register update: new=${{ steps.scraper.outputs.new_count }} changed=${{ steps.scraper.outputs.changed_count }} removed=${{ steps.scraper.outputs.removed_count }}"
          git push

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accc-register-${{ github.run_id }}
          path: |
            data/register.csv
            data/summary.json
            data/latest_changes.json
          retention-days: 90

      - name: Email notification on changes
        if: steps.scraper.outputs.has_changes == 'true' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: ACCC Monitor <${{ secrets.MAIL_USERNAME }}>
          subject: "ACCC Register update: ${{ steps.scraper.outputs.new_count }} new, ${{ steps.scraper.outputs.changed_count }} changed"
          body: |
            The ACCC Acquisitions Register has been updated.

            New entries:     ${{ steps.scraper.outputs.new_count }}
            Changed entries: ${{ steps.scraper.outputs.changed_count }}
            Removed entries: ${{ steps.scraper.outputs.removed_count }}

            Download the latest CSV:
            ${{ github.server_url }}/${{ github.repository }}/raw/main/data/register.csv

            View what changed:
            ${{ github.server_url }}/${{ github.repository }}/blob/main/data/latest_changes.json

            Full changelog:
            ${{ github.server_url }}/${{ github.repository }}/blob/main/data/changelog.json

            ACCC Register:
            https://www.accc.gov.au/public-registers/mergers-and-acquisitions-registers/acquisitions-register

      - name: Email new consultation documents
        if: steps.scraper.outputs.consultation_doc_count != '0' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: ACCC Monitor <${{ secrets.MAIL_USERNAME }}>
          subject: "ACCC — ${{ steps.scraper.outputs.consultation_doc_count }} new consultation document(s) published"
          attachments: data/consultation_docs/*
          body: |
            The ACCC has published new consultation document(s).

            ${{ steps.scraper.outputs.consultation_doc_count }} document(s) are attached.
            File type may be Word or PDF depending on the case.

            These relate to active consultation periods where the ACCC is
            seeking submissions from interested parties.

            Documents are also stored permanently here:
            ${{ github.server_url }}/${{ github.repository }}/tree/main/data/consultation_docs

            ACCC Register:
            https://www.accc.gov.au/public-registers/mergers-and-acquisitions-registers/acquisitions-register


            Documents are also stored permanently here:
            ${{ github.server_url }}/${{ github.repository }}/tree/main/data/decision_docs

            Full details:
            ${{ github.server_url }}/${{ github.repository }}/blob/main/data/new_documents.json

            ACCC Register:
            https://www.accc.gov.au/public-registers/mergers-and-acquisitions-registers/acquisitions-register


      - name: Email Excel register to recipients
        if: env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: ACCC Monitor <${{ secrets.MAIL_USERNAME }}>
          subject: "ACCC Register — ${{ steps.scraper.outputs.new_count }} new · ${{ steps.scraper.outputs.changed_count }} changed · ${{ steps.scraper.outputs.removed_count }} removed"
          attachments: data/register.xlsx
          body: |
            ACCC Acquisitions Register — automated update

            Run completed at: ${{ steps.scraper.outputs.run_utc }}

            Changes this run:
              New entries:     ${{ steps.scraper.outputs.new_count }}
              Changed entries: ${{ steps.scraper.outputs.changed_count }}
              Removed entries: ${{ steps.scraper.outputs.removed_count }}

            The full register is attached as an Excel workbook with four tabs:
              • Raw Data       — all 260+ entries
              • Notifications  — notification cases only, sorted by date
              • Waivers        — waiver cases only, sorted by date
              • Summary        — run statistics and timestamps

            Auto-run schedule: Mon–Fri, 10am and 4pm AEST
            
            ACCC Register: https://www.accc.gov.au/public-registers/mergers-and-acquisitions-registers/acquisitions-register
          
  verify:
    name: Verify Data Accuracy
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verification
        id: verify
        run: python verify.py

      - name: Commit verification report
        run: |
          git config user.name "ACCC Monitor Bot"
          git config user.email "actions@github.com"
          git add data/verification_report.json data/verification_report.csv data/verification_summary.json || true
          git diff --cached --quiet || git commit -m "Verification: errors=${{ steps.verify.outputs.error_count }} warnings=${{ steps.verify.outputs.warning_count }}"
          git push

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ github.run_id }}
          path: |
            data/verification_report.csv
            data/verification_summary.json
          retention-days: 90

      - name: Email alert on verification errors
        if: steps.verify.outputs.verification_passed == 'false' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: ACCC Monitor <${{ secrets.MAIL_USERNAME }}>
          subject: "ACCC Register VERIFICATION FAILED - ${{ steps.verify.outputs.error_count }} errors found"
          body: |
            The automated accuracy verification found errors in the scraped data.

            Errors:   ${{ steps.verify.outputs.error_count }}
            Warnings: ${{ steps.verify.outputs.warning_count }}

            Do NOT rely on the data until you review the error list.

            Download the verification report:
            ${{ github.server_url }}/${{ github.repository }}/raw/main/data/verification_report.csv

            View the Actions run log:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Human review is required.
